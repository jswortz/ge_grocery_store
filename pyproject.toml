[project]
name = "ge-grocery-store"
version = "0.1.0"
description = "Gemini Enterprise workshop: grocery retail agent with StreamAssist, ADK, and BigQuery analytics"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "google-auth>=2.0.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-storage>=2.0.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "pandas>=2.1.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "websockets>=12.0",
    "a2ui-agent-sdk>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0.0",
    "responses>=0.23.0",
    "playwright>=1.40.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
index-url = "https://pypi.org/simple/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "integration: marks tests that require live API access (deselect with '-m \"not integration\"')",
    "e2e: marks end-to-end tests requiring a running frontend (deselect with '-m \"not e2e\"')",
]
