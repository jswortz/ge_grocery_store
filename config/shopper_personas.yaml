# ============================================================
# Pre-Researched Shopper Personas
# ============================================================
# Based on grocery retail industry research (FMI, IRI/Circana,
# Nielsen, Hartman Group). Distribution weights sum to 1.0 and
# reflect approximate share of grocery traffic by segment.

personas:
  - id: budget_family
    name: "Budget-Conscious Family Shopper"
    description: "Parent shopping for a family of 4, focused on value, weekly staples, and stretching every dollar."
    distribution_weight: 0.25
    demographics:
      age_range: "30-45"
      household_size: 4
      income_bracket: "$45K-$65K"
    shopping_behavior:
      avg_basket_items: 35
      avg_spend: 127.00
      budget: 140.00
      visit_frequency: "weekly"
      time_in_store_min: 45
      list_adherence: 0.75
      impulse_tendency: 0.30
    category_preferences:
      produce: 0.8
      dairy: 0.9
      bakery: 0.6
      meat: 0.7
      frozen: 0.5
      snacks: 0.4
      beverages: 0.3
      pantry: 0.8
    endcap_sensitivity:
      discount_threshold: 0.15
      brand_loyalty: 0.6
      novelty_seeking: 0.3
    loyalty_tier: "Silver"

