# ============================================================
# Workshop Configuration — Retailer-Agnostic Settings
# ============================================================
# IMPORTANT: Never hardcode client/retailer names in source code.
# All retailer-specific strings are defined here and loaded at runtime.

retailer:
  name: "ValueFresh Market"
  tagline: "Fresh choices, every day."
  stores:
    - store_id: 1
      store_name: "Downtown Market"
      city: "Austin"
      state: "TX"
      zip_code: "78701"
      square_feet: 85000
      open_date: "2015-03-12"
    - store_id: 2
      store_name: "Westside Market"
      city: "San Antonio"
      state: "TX"
      zip_code: "78204"
      square_feet: 62000
      open_date: "2008-07-01"
    - store_id: 3
      store_name: "Lakefront Market"
      city: "Houston"
      state: "TX"
      zip_code: "77006"
      square_feet: 74000
      open_date: "2019-11-15"

models:
  adk: "gemini-3.5-flash"                    # Orchestrator / root agent (complex reasoning + tool use)
  adk_fast: "gemini-3.5-flash"              # Sub-agents, analytics, streaming (lower latency)
  imagen: "gemini-3.1-flash-image-preview"   # Image generation — Nano Banana 2 (requires global)
  live: "gemini-2.0-flash-live-001"          # Live API (BIDI voice streaming, requires us-east4)

project:
  id: "wortz-project-352116"
  number: "679926387543"
  location: "global"
  engine_id: "grocery-workshop-engine"
  agent_id: "17243023720609589156"  # ADK agent registered on Discovery Engine (adkAgentDefinition)
  agent_engine_id: "5752190188465946624"  # ADK agent deployed to Agent Engine (with A2UI + OTel)
  mcp_agent_engine_id: "6529624074140778496"  # MCP BigQuery analyst on Agent Engine (with A2UI + OTel)
  mcp_agent_id: "14712399455883730663"  # MCP agent registered on Discovery Engine (adkAgentDefinition)
  simulator_agent_engine_id: "6121485357910327296"  # Shopper simulator on Agent Engine (with A2UI + OTel)
  simulator_agent_id: "9024298725869758384"  # Shopper simulator registered on Discovery Engine (adkAgentDefinition)
  a2a_cloud_run_url: "https://grocery-a2a-agent-679926387543.us-central1.run.app"  # A2A agent on Cloud Run
  a2a_agent_id: "7469500119372284321"  # A2A agent registered on Discovery Engine (a2aAgentDefinition)
  simulator_a2a_cloud_run_url: "https://simulator-a2a-agent-679926387543.us-central1.run.app"  # Simulator A2A on Cloud Run
  simulator_a2a_agent_id: "17111513458812321441"  # Simulator A2A registered on Discovery Engine
  data_agent_id: "14793816534468506603"  # Data Insights Agent for BQ analytics
  authorization_id: "grocery-data-agent-auth"  # OAuth auth resource for data agent

bigquery:
  project: "wortz-project-352116"
  dataset: "ge_grocery_demo"
  location: "US"

gcs:
  bucket: "wortz-project-352116-ge-workshop"
  brand_guidelines_prefix: "brand_guidelines/"
  sop_prefix: "sops/"

memory:
  enabled: true
  location: "us-central1"   # Must match Agent Engine region

model_armor:
  enabled: true
  template_id: "grocery-workshop-armor-us"
  location: "us"   # Must be 'us' multi-region to match global Discovery Engine
  failure_mode: "FAIL_OPEN"

voice:
  enabled: true                  # Enable voice input/output in the frontend
  voice_name: "Puck"             # ADK Live API voice (Puck, Charon, Kore, Fenrir, Aoede, Leda, Orus, Zephyr)
  live_location: "us-east4"      # Vertex AI region for Live API (gemini-2.0-flash-live-001)
  ws_port: 8081                  # WebSocket port for voice server
  input_lang: "en-US"            # Web Speech API recognition language (fallback)
  output_enabled: true           # Enable text-to-speech for agent responses
  output_voice: "Google US English"  # SpeechSynthesis voice name (browser TTS fallback)
  output_rate: 1.0               # Speech rate (0.1 - 10)
  output_pitch: 1.0              # Speech pitch (0 - 2)

drive:
  folder_id: ""      # Populated after uploading assets
