<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  background: #ffffff;
}
.top-bar {
  background: #4285F4;
  height: 8pt;
  width: 100%;
}
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40pt;
}
h1 { color: #3C4043; font-size: 36pt; margin: 0 0 12pt 0; text-align: center; }
h2 { color: #5F6368; font-size: 20pt; margin: 0 0 30pt 0; font-weight: normal; text-align: center; }
.accent-bar {
  width: 60pt; height: 4pt; background: #4285F4; margin: 0 0 30pt 0;
}
.dots {
  display: flex; gap: 8pt; margin: 0 0 30pt 0;
}
.dot { width: 10pt; height: 10pt; border-radius: 50%; }
.dot-blue { background: #4285F4; }
.dot-red { background: #EA4335; }
.dot-yellow { background: #FBBC04; }
.dot-green { background: #34A853; }
p.repo { color: #5F6368; font-size: 11pt; margin: 0; }
.bottom-bar {
  background: #4285F4;
  height: 4pt;
  width: 100%;
}
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="content">
  <h1>Gemini Enterprise Workshop</h1>
  <h2>Grocery Retail</h2>
  <div class="accent-bar"></div>
  <div class="dots">
    <div class="dot dot-blue"></div>
    <div class="dot dot-red"></div>
    <div class="dot dot-yellow"></div>
    <div class="dot dot-green"></div>
  </div>
  <p>Agentic AI for Store Operations</p>
  <p class="repo">Google Cloud | Gemini Enterprise (Discovery Engine API)</p>
</div>
<div class="bottom-bar"></div>
</body>
</html>
